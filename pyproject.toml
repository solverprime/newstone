[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gdelt-pipeline"
version = "0.1.0"
description = "Pipeline to analyze GDELT tone data across places"
authors = [{name = "Automated Agent"}]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4",
]

dynamic = ["readme"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["gdelt_pipeline"]
